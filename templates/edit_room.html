{% extends "base.html" %}
{% block content %}
<div class="center-card">
    <div class="glass-panel form-card">
        <div class="eyebrow">Room editor</div>
        <h1>Edit Room</h1>
        <form method="POST">
            <input type="text" name="room_no" value="{{ room.room_no }}" required>
            <div class="form-row">
                <select name="gender"><option {% if room.gender=="Male" %}selected{% endif %}>Male</option><option {% if room.gender=="Female" %}selected{% endif %}>Female</option></select>
                <select name="year"><option {% if room.year=="1st Year" %}selected{% endif %}>1st Year</option><option {% if room.year=="2nd Year" %}selected{% endif %}>2nd Year</option><option {% if room.year=="3rd Year" %}selected{% endif %}>3rd Year</option></select>
            </div>
            <div class="form-row">
                <input type="number" name="capacity" value="{{ room.capacity }}" min="1" required>
                <input type="text" name="block" value="{{ room.block }}" required>
                <input type="number" name="floor" value="{{ room.floor }}" min="0" required>
            </div>
            <div class="form-row">
                <select name="noise_level"><option {% if room.noise_level=="Quiet" %}selected{% endif %}>Quiet</option><option {% if room.noise_level=="Moderate" %}selected{% endif %}>Moderate</option><option {% if room.noise_level=="Noisy" %}selected{% endif %}>Noisy</option></select>
                <select name="room_type"><option {% if room.room_type=="Standard" %}selected{% endif %}>Standard</option><option {% if room.room_type=="Premium" %}selected{% endif %}>Premium</option></select>
            </div>
            <button class="btn primary full" type="submit">Update Room</button>
        </form>
    </div>
</div>
{% endblock %}
